<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="stShifts — Gestión de horarios" />
    <title>stShifts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check for a newer sw.js right away, then every 15 min while the app stays open.
            reg.update();
            setInterval(() => reg.update(), 15 * 60 * 1000);
          });

          // As soon as a new service worker takes control, reload automatically
          // so the person always ends up on the latest version without doing
          // anything manually.
          let alreadyRefreshed = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (alreadyRefreshed) return;
            alreadyRefreshed = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
